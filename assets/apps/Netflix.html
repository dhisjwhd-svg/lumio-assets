<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netflix</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#e5e5e5;font-family:system-ui,sans-serif}
  #boot{display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:16px}
  .n{font-size:28px;font-weight:800;color:#e50914;letter-spacing:1px;filter:drop-shadow(0 0 20px rgba(229,9,20,.4))}
  .bar{width:160px;height:3px;background:#222;border-radius:2px;overflow:hidden}
  .bar i{display:block;height:100%;width:35%;background:linear-gradient(90deg,#b20710,#e50914,#f6121d);animation:s 1.1s linear infinite}
  @keyframes s{0%{transform:translateX(-100%)}100%{transform:translateX(380%)}}
</style>
</head>
<body>
<div id="boot">
  <div class="n">NETFLIX</div>
  <div class="bar"><i></i></div>
  <div style="font-size:12px;opacity:.55">Loading polished UI…</div>
</div>
<script>
(async function () {
  const RAW = 'https://raw.githubusercontent.com/dhisjwhd-svg/lumio-assets/a4f1378a46fff27ffc8e1c3507f7f88d89891247/assets/apps/Netflix.html';
  const STYLE = `<style id=\"netflix-aesthetic-2026-revamp\">\n/* =========================================================\n   NETFLIX AESTHETIC REVAMP — Professional / Cool / Polished\n   Final visual pass (Oct 2026)\n   ========================================================= */\n\n:root {\n  --nflx-red: #e50914;\n  --nflx-red-hover: #f6121d;\n  --nflx-red-dark: #b20710;\n  --nflx-black: #0b0b0b;\n  --nflx-bg: #141414;\n  --nflx-elevated: #1a1a1a;\n  --nflx-card: #181818;\n  --nflx-text: #e5e5e5;\n  --nflx-muted: #b3b3b3;\n  --nflx-dim: #808080;\n}\n\n#yuki-app,\n#yuki-app #flix,\n#yuki-app .flix-body,\n#yuki-app #flix.on {\n  background: var(--nflx-bg) !important;\n  color: var(--nflx-text) !important;\n  font-family: \"Netflix Sans\", \"Helvetica Neue\", Helvetica, Arial, sans-serif !important;\n}\n\n/* Chrome */\n#yuki-app .yuki-chrome {\n  background: #000 !important;\n  border-bottom: 1px solid rgba(255,255,255,.06) !important;\n  height: 30px !important;\n}\n\n/* Top nav / header */\n#yuki-app header.school-header,\n#flixBar,\n.school-header {\n  background: linear-gradient(180deg, rgba(0,0,0,.92) 0%, rgba(0,0,0,.55) 55%, transparent 100%) !important;\n  border: none !important;\n  backdrop-filter: blur(8px);\n  height: 68px !important;\n}\n#yuki-app header.school-header .wrap,\n#flixBar .wrap {\n  height: 68px !important;\n  padding: 0 36px !important;\n  gap: 22px !important;\n  align-items: center !important;\n}\n\n#yuki-app .school-brand .logo-text svg.nflx-wordmark,\n#yuki-app .yuki-chrome .nlogo svg {\n  width: 100px !important;\n  height: auto !important;\n  filter: drop-shadow(0 0 8px rgba(229,9,20,.25));\n}\n\n#yuki-app header.school-header nav button,\n#flixBar nav button,\n#flixMainNav button {\n  height: 36px !important;\n  padding: 0 16px !important;\n  border-radius: 4px !important;\n  font-size: 14px !important;\n  font-weight: 500 !important;\n  color: #e5e5e5 !important;\n  opacity: 0.9 !important;\n  transition: color .15s, background .15s, opacity .15s !important;\n}\n#yuki-app header.school-header nav button:hover,\n#flixBar nav button:hover,\n#flixMainNav button:hover {\n  color: #fff !important;\n  background: rgba(255,255,255,.08) !important;\n  opacity: 1 !important;\n}\n#yuki-app header.school-header nav button.active,\n#flixBar nav button.active,\n#flixMainNav button.active {\n  color: #fff !important;\n  font-weight: 700 !important;\n  opacity: 1 !important;\n  background: transparent !important;\n}\n\n#navImportModules {\n  margin-left: auto !important;\n  background: linear-gradient(180deg, #f6121d 0%, #e50914 100%) !important;\n  color: #fff !important;\n  font-weight: 700 !important;\n  border: none !important;\n  border-radius: 4px !important;\n  padding: 0 18px !important;\n  height: 36px !important;\n  box-shadow: 0 2px 12px rgba(229,9,20,.35) !important;\n  opacity: 1 !important;\n}\n#navImportModules:hover {\n  background: linear-gradient(180deg, #ff2a34 0%, #f6121d 100%) !important;\n  box-shadow: 0 4px 18px rgba(229,9,20,.45) !important;\n}\n#navImportModules.is-active {\n  background: rgba(229,9,20,.22) !important;\n  border: 1px solid rgba(229,9,20,.5) !important;\n  box-shadow: none !important;\n}\n\n/* Billboard / Hero */\n#yuki-app .flix-billboard,\n#flixHero {\n  min-height: min(56vh, 460px) !important;\n  position: relative !important;\n}\n#yuki-app .flix-billboard::after {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  background: linear-gradient(90deg, rgba(20,20,20,.95) 0%, rgba(20,20,20,.55) 40%, transparent 70%),\n              linear-gradient(0deg, #141414 0%, transparent 45%);\n  pointer-events: none;\n  z-index: 1;\n}\n#yuki-app .flix-billboard > * {\n  position: relative;\n  z-index: 2;\n}\n\n/* Title / meta on hero */\n#yuki-app .flix-billboard h1,\n#yuki-app .billboard-title {\n  font-size: clamp(2.2rem, 5vw, 3.6rem) !important;\n  font-weight: 800 !important;\n  letter-spacing: -0.5px !important;\n  color: #fff !important;\n  text-shadow: 0 2px 24px rgba(0,0,0,.6) !important;\n  margin-bottom: 12px !important;\n}\n#yuki-app .flix-billboard p,\n#yuki-app .billboard-desc {\n  font-size: 1.05rem !important;\n  line-height: 1.45 !important;\n  color: #d2d2d2 !important;\n  max-width: 42ch !important;\n  text-shadow: 0 1px 8px rgba(0,0,0,.5);\n}\n\n/* Buttons */\n#yuki-app .button.primary,\n.button.primary {\n  background: #fff !important;\n  color: #141414 !important;\n  font-weight: 700 !important;\n  border-radius: 4px !important;\n  padding: 12px 28px !important;\n  border: none !important;\n  box-shadow: 0 4px 16px rgba(0,0,0,.35) !important;\n  transition: transform .15s, filter .15s, background .15s !important;\n}\n#yuki-app .button.primary:hover,\n.button.primary:hover {\n  background: #e6e6e6 !important;\n  transform: translateY(-1px);\n  filter: brightness(1.02);\n}\n#yuki-app .button.outline,\n.button.outline {\n  background: rgba(109,109,110,.55) !important;\n  backdrop-filter: blur(6px);\n  border: none !important;\n  color: #fff !important;\n  border-radius: 4px !important;\n  padding: 12px 24px !important;\n  font-weight: 650 !important;\n  transition: background .15s, transform .15s !important;\n}\n#yuki-app .button.outline:hover,\n.button.outline:hover {\n  background: rgba(109,109,110,.35) !important;\n  transform: translateY(-1px);\n}\n\n/* Rows / sections */\n#yuki-app .row-title,\n#yuki-app .section-title,\n#yuki-app .flix-row-title {\n  font-size: 1.2rem !important;\n  font-weight: 700 !important;\n  color: #e5e5e5 !important;\n  letter-spacing: .2px !important;\n  margin: 0 0 12px 4px !important;\n}\n#yuki-app .section-space,\n#yuki-app .flix-row {\n  margin-bottom: 28px !important;\n  padding: 0 28px !important;\n}\n\n/* Posters / cards */\n#yuki-app .poster-button,\n.poster-button,\n#yuki-app .anime-card,\n#yuki-app .title-card {\n  border-radius: 6px !important;\n  overflow: hidden !important;\n  transition: transform .22s cubic-bezier(.2,.8,.2,1), box-shadow .22s !important;\n  box-shadow: 0 4px 14px rgba(0,0,0,.35);\n  background: var(--nflx-card) !important;\n}\n#yuki-app .poster-button:hover,\n.poster-button:hover,\n#yuki-app .anime-card:hover,\n#yuki-app .title-card:hover {\n  transform: scale(1.08) !important;\n  box-shadow: 0 12px 32px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08) !important;\n  z-index: 5;\n}\n#yuki-app .anime-card h2,\n#yuki-app .poster-button .title,\n#yuki-app .title-card .title {\n  font-size: 13px !important;\n  font-weight: 600 !important;\n  color: #e5e5e5 !important;\n}\n\n/* Who's watching */\n#yuki-app .yuki-who {\n  background: #141414 !important;\n}\n#yuki-app .yuki-who-inner h1 {\n  font-weight: 400 !important;\n  font-size: clamp(2rem, 5vw, 3.4rem) !important;\n  color: #fff !important;\n  letter-spacing: .02em !important;\n}\n#yuki-app .yuki-prof .av {\n  border-radius: 6px !important;\n  outline: 3px solid transparent !important;\n  transition: outline-color .15s, transform .2s !important;\n  box-shadow: 0 6px 20px rgba(0,0,0,.4);\n}\n#yuki-app .yuki-prof:hover .av {\n  outline-color: #fff !important;\n  transform: scale(1.06) !important;\n}\n#yuki-app .yuki-prof .nm {\n  color: #808080 !important;\n  font-weight: 500 !important;\n  margin-top: .9rem !important;\n}\n#yuki-app .yuki-prof:hover .nm {\n  color: #fff !important;\n}\n#yuki-app .yuki-manage {\n  border: 1px solid #808080 !important;\n  color: #808080 !important;\n  border-radius: 2px !important;\n  text-transform: uppercase !important;\n  letter-spacing: .14em !important;\n  font-size: .85rem !important;\n  padding: 0.65rem 1.7rem !important;\n  background: transparent !important;\n  transition: border-color .15s, color .15s !important;\n}\n#yuki-app .yuki-manage:hover {\n  border-color: #fff !important;\n  color: #fff !important;\n}\n\n/* Boot splash */\n#yuki-app .yuki-boot,\n#yukiBoot {\n  background: #000 !important;\n}\n#yuki-app .ff-nflx-logo,\n#yuki-app .nflx-boot-logo {\n  filter: drop-shadow(0 0 48px rgba(229,9,20,.4)) !important;\n}\n#yuki-app .yuki-boot-ring,\n#yuki-app .ff-nflx-spinner {\n  border-top-color: var(--nflx-red) !important;\n}\n\n/* Module importer modal */\n#ffModuleImporter {\n  background: rgba(0,0,0,.88) !important;\n  backdrop-filter: blur(10px);\n}\n#ffModuleImporter .ff-mod-card {\n  background: #1a1a1a !important;\n  border: 1px solid rgba(255,255,255,.08) !important;\n  border-radius: 10px !important;\n  box-shadow: 0 24px 64px rgba(0,0,0,.6) !important;\n}\n#ffModuleImporter .ff-mod-btn.primary,\n#ffModPickFile {\n  background: linear-gradient(180deg, #f6121d, #e50914) !important;\n  border: none !important;\n  border-radius: 4px !important;\n  font-weight: 700 !important;\n  box-shadow: 0 4px 16px rgba(229,9,20,.3) !important;\n}\n#ffModActiveBox {\n  background: rgba(229,9,20,.1) !important;\n  border: 1px solid rgba(229,9,20,.35) !important;\n  border-radius: 8px !important;\n}\n\n/* Scrollbars */\n#yuki-app ::-webkit-scrollbar {\n  width: 10px;\n  height: 8px;\n}\n#yuki-app ::-webkit-scrollbar-track {\n  background: #0b0b0b;\n}\n#yuki-app ::-webkit-scrollbar-thumb {\n  background: #333;\n  border-radius: 8px;\n  border: 2px solid #0b0b0b;\n}\n#yuki-app ::-webkit-scrollbar-thumb:hover {\n  background: #555;\n}\n\n/* Selection + focus */\n#yuki-app ::selection {\n  background: rgba(229,9,20,.35) !important;\n  color: #fff !important;\n}\n#yuki-app button:focus-visible,\n#yuki-app .poster-button:focus-visible {\n  outline: 2px solid #fff !important;\n  outline-offset: 3px !important;\n}\n\n/* Detail / episode lists if present */\n#yuki-app .episode-row,\n#yuki-app .season-picker {\n  border-radius: 6px !important;\n}\n#yuki-app .episode-row:hover {\n  background: rgba(255,255,255,.06) !important;\n}\n\n/* Responsive */\n@media (max-width: 900px) {\n  #yuki-app header.school-header .wrap,\n  #flixBar .wrap {\n    padding: 0 16px !important;\n    gap: 12px !important;\n  }\n  #yuki-app .section-space,\n  #yuki-app .flix-row {\n    padding: 0 16px !important;\n  }\n  #yuki-app .flix-billboard h1 {\n    font-size: 1.8rem !important;\n  }\n}\n@media (max-width: 600px) {\n  #yuki-app header.school-header nav button {\n    padding: 0 10px !important;\n    font-size: 13px !important;\n  }\n  #navImportModules {\n    padding: 0 12px !important;\n    font-size: 12px !important;\n  }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  #yuki-app *,\n  #yuki-app *::before,\n  #yuki-app *::after {\n    animation: none !important;\n    transition: none !important;\n  }\n}\n</style>`;
  try {
    const res = await fetch(RAW, { cache: "no-store" });
    if (!res.ok) throw new Error("fetch " + res.status);
    let html = await res.text();
    if (html.includes("</body>")) {
      html = html.replace("</body>", STYLE + "\n</body>");
    } else {
      html += STYLE;
    }
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.getElementById("boot").innerHTML =
      "<div style=\"padding:24px;max-width:420px;text-align:center\">" +
      "<div style=\"font-weight:700;margin-bottom:8px;color:#e50914\">Could not load Netflix UI</div>" +
      "<div style=\"font-size:13px;opacity:.75;margin-bottom:12px\">" + (e && e.message ? e.message : e) + "</div>" +
      "<button onclick=\"location.reload()\" style=\"padding:8px 16px;border-radius:4px;border:0;background:#e50914;color:#fff;font-weight:700;cursor:pointer\">Retry</button>" +
      "</div>";
  }
})();
</script>
</body>
</html>
