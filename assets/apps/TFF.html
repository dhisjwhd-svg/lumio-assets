// Ambient motion layer: slow drifting light-petals, linked points, and cursor-reactive glow.
const ambient=$('ambient-canvas'),ctx=ambient&&ambient.getContext('2d');

function drawAmbient(){if(!ctx||reduced.matches||document.hidden)return;ctx.clearRect(0,0,w,h);ambientTick+=.008;const rgb=active===1?'216,176,242':'241,185,216';
for(let i=0;i<motes.length;i++){const p=motes[i];p.x+=p.vx+Math.sin(ambientTick+p.phase)*.16;p.y+=p.vy;if(p.y<-12){p.y=h+12;p.x=Math.random()*w}if(p.x<-12)p.x=w+12;if(p.x>w+12)p.x=-12;const dx=p.x-mouse.x,dy=p.y-mouse.y,dist=Math.hypot(dx,dy);if(dist<125&&dist>0){p.x+=dx/dist*.12;p.y+=dy/dist*.12}
ctx.globalAlpha=p.a*(.72+.28*Math.sin(ambientTick*2+p.phase));ctx.fillStyle='rgba('+rgb+',1)';ctx.beginPath();if(p.kind){ctx.ellipse(p.x,p.y,p.r*.7,p.r*2.4,Math.sin(ambientTick+p.phase),0,Math.PI*2)}else ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();

if(ambient&&ctx){resizeAmbient();if(!reduced.matches)raf=requestAnimationFrame(drawAmbient);addEventListener('resize',resizeAmbient,{passive:true});addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;},{passive:true});addEventListener('pointerleave',()=>{mouse.x=-9999;mouse.y=-9999});document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(raf);if(!document.hidden&&!reduced.matches)raf=requestAnimationFrame(drawAmbient)});reduced.addEventListener?.('change',()=>{cancelAnimationFrame(raf);if(reduced.matches){ctx.clearRect(0,0,w,h)}else raf=requestAnimationFrame(drawAmbient)})}

let active=0,busy=false;
function setImage(img,url,alt){img.onerror=null;img.src=url;img.alt=alt;img.onerror=()=>{if(img.src.includes('cdn.jsdelivr.net/gh/dhisjwhd-svg/lumio-assets@main/')){img.onerror=null;img.src=url.replace('https://cdn.jsdelivr.net/gh/dhisjwhd-svg/lumio-assets@main/','https://raw.githubusercontent.com/dhisjwhd-svg/lumio-assets/main/');}}}
function render(index){const m=members[index];document.body.style.setProperty('--accent',index===1?'#d8b0f2':'#f1b9d8');document.body.style.setProperty('--accent-rgb',index===1?'216,176,242':'241,185,216');$('name').textContent=m.name;$('handle').textContent=m.handle;const bio=$('bio');const quoteIndex=m.bio.indexOf('\n“');if(quoteIndex>=0){bio.replaceChildren(document.createTextNode(m.bio.slice(0,quoteIndex+1)));const quote=document.createElement('span');quote.className='quote';quote.textContent=m.bio.slice(quoteIndex+1);bio.append(quote)}else bio.textContent=m.bio;setImage($('banner'),m.banner,m.name+' cover');setImage($('avatar'),m.avatar,m.name+' profile picture');$('role').textContent=index===0?'personal page':'member profile';$('member-status').textContent='profile 00'+(index+1);$('socials').classList.toggle('single',m.links.length===1);$('connection-note').textContent=m.links.length===1?'1 social profile':'social profiles';$('socials').innerHTML=m.links.map(l=>'<a class="social" href="'+l.url+'" target="_blank" rel="noopener noreferrer" aria-label="'+l.label+'">'+icons[l.icon]+'<span>'+l.label+'</span></a>').join('');document.querySelector('.profile-number').textContent='profile 00'+(index+1);prev.hidden=index===0;next.hidden=index===members.length-1;document.title=m.name+' — The Forged Flowers'}
function preloadMember(index){const m=members[index];return Promise.all([m.banner,m.avatar].map(src=>new Promise(resolve=>{const img=new Image();let done=false;const finish=()=>{if(done)return;done=true;resolve()};img.onload=finish;img.onerror=finish;img.src=src;setTimeout(finish,900)})))}
async function go(index){if(busy||index<0||index>=members.length||index===active)return;busy=true;await preloadMember(index);if(!card.isConnected){busy=false;return}card.classList.add('member-leaving');setTimeout(()=>{active=index;render(active);card.classList.remove('member-leaving');card.classList.add('member-entering');requestAnimationFrame(()=>requestAnimationFrame(()=>{card.classList.remove('member-entering');setTimeout(()=>busy=false,matchMedia('(prefers-reduced-motion: reduce)').matches?0:240)}))},matchMedia('(prefers-reduced-motion: reduce)').matches?0:180)}
let pointerFrame=0,pendingPointer=null;function trackPointer(e){if(matchMedia('(hover: none), (pointer: coarse)').matches||matchMedia('(prefers-reduced-motion: reduce)').matches)return;pendingPointer=e;if(pointerFrame)return;pointerFrame=requestAnimationFrame(()=>{pointerFrame=0;if(!pendingPointer)return;const p=pendingPointer;pendingPointer=null;const r=card.getBoundingClientRect(),px=Math.max(0,Math.min(1,(p.clientX-r.left)/r.width)),py=Math.max(0,Math.min(1,(p.clientY-r.top)/r.height));card.style.setProperty('--spot-x',(px*100).toFixed(2)+'%');card.style.setProperty('--spot-y',(py*100).toFixed(2)+'%');card.style.setProperty('--tilt-x',((px-.5)*5).toFixed(2)+'deg');card.style.setProperty('--tilt-y',((.5-py)*4).toFixed(2)+'deg');card.style.setProperty('--pointer-glow','1')})}function resetPointer(){card.style.setProperty('--tilt-x','0deg');card.style.setProperty('--tilt-y','0deg');card.style.setProperty('--spot-x','50%');card.style.setProperty('--spot-y','50%');card.style.setProperty('--pointer-glow','0')}card.addEventListener('pointermove',trackPointer,{passive:true});card.addEventListener('pointerleave',resetPointer);prev.addEventListener('click',()=>go(active-1));next.addEventListener('click',()=>go(active+1));document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowLeft'&&!prev.hidden)go(active-1);if(e.key==='ArrowRight'&&!next.hidden)go(active+1)});let touchX=null;card.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].clientX},{passive:true});card.addEventListener('touchend',e=>{if(touchX===null)return;const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>65)go(active+(dx<0?1:-1));touchX=null},{passive:true});render(0)
})();
