<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#313338">
<title>moon.d.flower — Discord profile</title>
<style>
:root{color-scheme:dark;--bg:#232428;--panel:#2b2d31;--panel2:#313338;--muted:#b5bac1;--line:#3f4147;--pink:#b9a3ff;--white:#f2f3f5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px 16px;background:linear-gradient(135deg,#202127,var(--bg) 52%,#25202e);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--white)}
.profile{width:min(100%,760px);overflow:hidden;border:1px solid #3b3d44;border-radius:12px;background:var(--panel);box-shadow:0 24px 80px #0008}
.banner{width:100%;height:auto;aspect-ratio:3/1;max-height:240px;position:relative;overflow:hidden;background:#292633;display:block}
.banner:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#2b2d31 0%,transparent 24%);pointer-events:none}
.banner img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;object-position:center;background:#292633}
.content{position:relative;padding:0 25px 25px}.avatar-wrap{width:clamp(88px,18vw,112px);height:clamp(88px,18vw,112px);margin-top:clamp(-60px,-8vw,-46px);position:relative;z-index:1;border:6px solid var(--panel);border-radius:50%;background:#312233;overflow:hidden;flex:none;isolation:isolate;aspect-ratio:1/1}.avatar{width:100%;height:100%;display:block;object-fit:cover;object-position:center;border-radius:50%;transform:none;clip-path:circle(50% at 50% 50%)}
.status{position:absolute;right:0;bottom:0;width:23px;height:23px;border:4px solid var(--panel);border-radius:50%;background:#5cba87}
.identity{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:13px}.name{font-size:25px;letter-spacing:-.7px;font-weight:760}.verified{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:6px;background:#5865f2;color:white;font-size:12px;font-weight:900}.handle{color:var(--muted);margin-top:1px}
.rule{height:1px;background:var(--line);margin:21px 0}.section-label{font-size:11px;font-weight:800;letter-spacing:1.6px;color:#b9a3ff;text-transform:uppercase;margin-bottom:10px}
.bio{font-size:15px;color:#e9e3ed;max-width:480px}.bio em{color:#f0b9d5;font-style:normal}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.pill{border:1px solid #454750;background:#313338;border-radius:7px;padding:6px 10px;color:#d9d0df;font-size:12px}
.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.link{display:flex;align-items:center;justify-content:center;gap:8px;min-height:45px;text-decoration:none;color:#f4edf7;border:1px solid #454750;background:#313338;border-radius:8px;font-size:13px;font-weight:650;transition:transform .18s,border-color .18s,background .18s}.link:hover{transform:translateY(-2px);border-color:#8e7bdb;background:#383344}.link svg{width:17px;height:17px;flex:none}
.footer{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:22px;color:#8f8799;font-size:11px;letter-spacing:.7px;text-transform:uppercase}.footer span:last-child{color:#b9a3ff}
/* Satoshi Wizard profile theme: coordinated plum/lilac tones for the Discord-style card and controls. */
.profile.member-two{--panel:#30263a;--panel2:#3a2d46;--line:#594466;background:var(--panel);border-color:#745781;box-shadow:0 24px 80px #0009,0 0 0 1px #d7a9ef12}
.profile.member-two .banner:after{background:linear-gradient(0deg,#30263a 0%,transparent 28%)}
.profile.member-two .avatar-wrap{background:#3a2d46}
.profile.member-two .verified{background:#9c72b8;color:#fff4ff}
.profile.member-two .section-label,.profile.member-two .footer span:last-child{color:#d6a9ef}
.profile.member-two .pill{background:#3b2c48;border-color:#725783;color:#f1dcfa}
.profile.member-two .link{background:#3a2b46;border-color:#765789;color:#fff2ff}
.profile.member-two .link:hover{background:#4a3558;border-color:#d6a9ef}
.profile.member-two .member-arrow{background:#352640e8;border-color:#d6a9ef55;color:#fff2ff}
.profile.member-two .member-arrow:hover{background:#51385f;border-color:#e3b7f6}
.link[hidden]{display:none}
.links.member-single{grid-template-columns:1fr}
body.member-two{background:radial-gradient(ellipse at 50% 0%,#392943 0%,transparent 58%),linear-gradient(135deg,#201a27,#241d2b 52%,#30233a)}
@media(max-width:440px){.content{padding:0 18px 20px}.name{font-size:22px}.links{grid-template-columns:1fr}.link{justify-content:flex-start;padding:0 15px}.footer{font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style>

<style id="tff-member-navigation">
.profile{transition:opacity .24s ease,transform .24s ease;will-change:opacity,transform}
.profile.member-leaving{opacity:0;transform:translateY(8px) scale(.992)}
.profile.member-entering{opacity:0;transform:translateY(8px) scale(.992)}
.member-arrow{position:fixed;top:50%;z-index:30;width:48px;height:48px;display:grid;place-items:center;border-radius:50%;border:1px solid #ffffff26;background:#292a32e8;color:#f5efff;box-shadow:0 10px 32px #0006;backdrop-filter:blur(14px);transform:translateY(-50%);transition:background .18s,border-color .18s,transform .18s,opacity .2s;cursor:pointer}
.member-arrow:hover{background:#423751;border-color:#b9a3ff;transform:translateY(-50%) scale(1.06)}
.member-arrow:focus-visible{outline:2px solid #b9a3ff;outline-offset:4px}
.member-arrow svg{width:21px;height:21px}
.member-arrow.left{left:4px}
.member-arrow.right{right:4px}
.member-arrow[hidden]{display:none}
.member-position{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:20;color:#a9a5b6;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;background:#202127b8;border:1px solid #ffffff12;border-radius:99px;padding:7px 11px;backdrop-filter:blur(12px)}
@media(max-width:600px){.member-arrow{width:40px;height:40px;top:auto;bottom:14px;transform:none}.member-arrow:hover{transform:scale(1.05)}.member-arrow.left{left:4px}.member-arrow.right{right:4px}.profile{margin-bottom:52px}}
@media(prefers-reduced-motion:reduce){.profile,.member-arrow{transition:none!important}}
</style>

</head>
<body>

</button>

</button>

<main class="profile" aria-label="Profile card">
<header class="banner" aria-label="Moon profile header">
<img src="https://raw.githubusercontent.com/dhisjwhd-svg/lumio-assets/main/images/profiles/moon-banner.png" data-fallback="https://cdn.jsdelivr.net/gh/dhisjwhd-svg/lumio-assets@main/images/profiles/moon-banner.png" alt="Moon profile banner" fetchpriority="high">
</header>
<div class="content">

<img class="avatar" src="https://raw.githubusercontent.com/dhisjwhd-svg/lumio-assets/main/images/profiles/kirby-dvd.jpg" data-fallback="https://cdn.jsdelivr.net/gh/dhisjwhd-svg/lumio-assets@main/images/profiles/kirby-dvd.jpg" alt="Moon profile picture" fetchpriority="high">
<span class="status" title="Online"></span>
</div>
<div class="identity"><div class="name">moon.d.flower</div><span class="verified" title="The Forged Flowers">✿</span></div>

<section aria-labelledby="about"><div class="section-label" id="about">About me</div><div class="bio">🥇 Jesus ✝️❤️<br>+ the math journal doc 📕<br>🌺🛠️ 𝒯𝒽𝑒 𝐹𝑜𝓇𝑔𝑒𝒹 𝐹𝓁𝑜𝓌𝑒𝓇𝓈 🛠️🌺<br>WebBlocker: 💡 lightspeed ⚡<br>∨ click below ∨</div></section>
<div class="rule"></div>
<section aria-labelledby="findme"><div class="section-label" id="findme">Connections</div>
<nav class="links" aria-label="Social links">
<a class="link" href="https://www.tiktok.com/@moon.d.flower" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.6 7.2a6.8 6.8 0 0 1-4.1-1.4v8.1a6.4 6.4 0 1 1-5.5-6.3v3.5a2.9 2.9 0 1 0 2 2.8V2.5h3.5c.2 2 1.8 3.8 4.1 4z"/></svg>TikTok</a>
<a class="link" href="https://github.com/dhisjwhd-svg" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .9a11.1 11.1 0 0 0-3.5 21.6c.6.1.8-.3.8-.6v-2.1c-3.1.7-3.8-1.3-3.8-1.3-.5-1.3-1.2-1.6-1.2-1.6-1-.7.1-.7.1-.7 1.1.1 1.7 1.1 1.7 1.1 1 1.7 2.6 1.2 3.2.9.1-.7.4-1.2.7-1.5-2.5-.3-5.1-1.3-5.1-5.5 0-1.2.4-2.2 1.1-3-.1-.3-.5-1.4.1-2.9 0 0 .9-.3 3.1 1.1a10.8 10.8 0 0 1 5.7 0C17.1 4.2 18 4.5 18 4.5c.6 1.5.2 2.6.1 2.9.7.8 1.1 1.8 1.1 3 0 4.2-2.6 5.2-5.1 5.5.4.3.8 1 .8 2v3.4c0 .3.2.7.8.6A11.1 11.1 0 0 0 12 .9Z"/></svg>GitHub</a>
</nav></section>
<div class="footer"><span class="profile-number">profile · 001</span><span>the forged flowers</span></div>
</div></main>

<script id="tff-member-switcher">
(() => {
  const card = document.querySelector('.profile');
  const prev = document.getElementById('member-prev');
  const next = document.getElementById('member-next');
  if (!card || !prev || !next) return;
  const original = {
    name: document.querySelector('.name').textContent,
    handle: document.querySelector('.handle').textContent,
    bio: document.querySelector('.bio').innerHTML,
    pills: document.querySelector('.pills').innerHTML,
    banner: document.querySelector('.banner img').src,
    avatar: document.querySelector('.avatar').src,
    bannerAlt: document.querySelector('.banner img').alt,
    avatarAlt: document.querySelector('.avatar').alt
  };
  const svgData = (svg) => 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
  const memberBanner = svgData('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#38274b"/><stop offset=".55" stop-color="#73577e"/><stop offset="1" stop-color="#e6a6c6"/></linearGradient><radialGradient id="r"><stop stop-color="#f9d5e9" stop-opacity=".8"/><stop offset="1" stop-color="#f9d5e9" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="400" fill="url(#g)"/><circle cx="900" cy="100" r="260" fill="url(#r)"/><g fill="none" stroke="#fff" stroke-opacity=".24" stroke-width="2"><circle cx="900" cy="190" r="125"/><circle cx="900" cy="190" r="165"/><circle cx="900" cy="190" r="205"/></g><g fill="#fff" fill-opacity=".82" font-family="Arial,sans-serif" font-weight="700"><text x="70" y="180" font-size="22" letter-spacing="8">THE FORGED FLOWERS</text><text x="65" y="255" font-size="74" letter-spacing="-3">made together.</text></g></svg>');
  const memberAvatar = svgData('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160"><defs><linearGradient id="a" x2="1" y2="1"><stop stop-color="#e8b9d4"/><stop offset="1" stop-color="#7865a8"/></linearGradient></defs><rect width="160" height="160" rx="80" fill="#30283b"/><circle cx="80" cy="80" r="68" fill="url(#a)"/><g fill="#fff" fill-opacity=".92"><path d="M80 31 91 65 126 76 91 87 80 122 69 87 34 76 69 65Z"/><circle cx="115" cy="39" r="5"/><circle cx="44" cy="113" r="4"/></g></svg>');
  const members = [
    original,
    {
      name: 'satoshi wizard',
      handle: '@satoshiwizard',
      bio: 'not everything needs an explanation ✧',
      pills: '<span class="pill">✦ The Forged Flowers</span><span class="pill">Satoshi Wizard</span>',
      banner: 'https://raw.githubusercontent.com/dhisjwhd-svg/lumio-assets/main/images/profiles/IMG_0102.jpeg',
      avatar: 'https://raw.githubusercontent.com/dhisjwhd-svg/lumio-assets/main/images/profiles/IMG_0101.jpeg',
      bannerAlt: 'The Forged Flowers banner',
      avatarAlt: 'TFF member profile picture'
    }
  ];
  let active = 0;
  let transitioning = false;
  const nameEl = document.querySelector('.name');
  const handleEl = document.querySelector('.handle');
  const bioEl = document.querySelector('.bio');
  const pillsEl = document.querySelector('.pills');
  const bannerEl = document.querySelector('.banner img');
  const avatarEl = document.querySelector('.avatar');
  function applyImageFallback(img) {
    if (!img) return;
    img.addEventListener('error', function () {
      const fallback = img.dataset.fallback;
      if (fallback && img.src !== fallback) {
        img.src = fallback;
        img.dataset.fallback = '';
      }
    });
  }
  applyImageFallback(bannerEl);
  applyImageFallback(avatarEl);
  const statusEl = document.querySelector('.status');
  const links = document.querySelectorAll('.links .link');
  const linksContainer = document.querySelector('.links');
  const profileNumber = document.querySelector('.profile-number');
  function renderMember(index) {
    const m = members[index];
    card.classList.toggle('member-two', index === 1);
    document.body.classList.toggle('member-two', index === 1);
    if (profileNumber) profileNumber.textContent = index === 1 ? 'profile 002' : 'profile · 001';
    nameEl.textContent = m.name;
    handleEl.textContent = m.handle;
    bioEl.innerHTML = m.bio;
    pillsEl.innerHTML = m.pills;
    bannerEl.dataset.fallback = m.banner.includes('raw.githubusercontent.com') ? m.banner.replace('https://raw.githubusercontent.com/dhisjwhd-svg/lumio-assets/main/', 'https://cdn.jsdelivr.net/gh/dhisjwhd-svg/lumio-assets@main/') : '';
    avatarEl.dataset.fallback = m.avatar.includes('raw.githubusercontent.com') ? m.avatar.replace('https://raw.githubusercontent.com/dhisjwhd-svg/lumio-assets/main/', 'https://cdn.jsdelivr.net/gh/dhisjwhd-svg/lumio-assets@main/') : '';
    bannerEl.src = m.banner;
    bannerEl.alt = m.bannerAlt;
    avatarEl.src = m.avatar;
    avatarEl.alt = m.avatarAlt;
    if (statusEl) statusEl.title = index === 0 ? 'Online' : 'Member';
    if (linksContainer) linksContainer.classList.toggle('member-single', index === 1);
    if (links.length >= 2) {
      links[1].hidden = index === 1;
      if (index === 0) {
        links[0].href = 'https://www.tiktok.com/@moon.d.flower';
        links[0].innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.6 7.2a6.8 6.8 0 0 1-4.1-1.4v8.1a6.4 6.4 0 1 1-5.5-6.3v3.5a2.9 2.9 0 1 0 2 2.8V2.5h3.5c.2 2 1.8 3.8 4.1 4z"/></svg>TikTok';
        links[1].href = 'https://github.com/dhisjwhd-svg';
        links[1].innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .9a11.1 11.1 0 0 0-3.5 21.6c.6.1.8-.3.8-.6v-2.1c-3.1.7-3.8-1.3-3.8-1.3-.5-1.3-1.2-1.6-1.2-1.6-1-.7.1-.7.1-.7 1.1.1 1.7 1.1 1.7 1.1 1 1.7 2.6 1.2 3.2.9.1-.7.4-1.2.7-1.5-2.5-.3-5.1-1.3-5.1-5.5 0-1.2.4-2.2 1.1-3-.1-.3-.5-1.4.1-2.9 0 0 .9-.3 3.1 1.1a10.8 10.8 0 0 1 5.7 0C17.1 4.2 18 4.5 18 4.5c.6 1.5.2 2.6.1 2.9.7.8 1.1 1.8 1.1 3 0 4.2-2.6 5.2-5.1 5.5.4.3.8 1 .8 2v3.4c0 .3.2.7.8.6A11.1 11.1 0 0 0 12 .9Z"/></svg>GitHub';
      } else {
        links[0].href = 'https://www.tiktok.com/@satoshiwizard';
        links[0].innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.6 7.2a6.8 6.8 0 0 1-4.1-1.4v8.1a6.4 6.4 0 1 1-5.5-6.3v3.5a2.9 2.9 0 1 0 2 2.8V2.5h3.5c.2 2 1.8 3.8 4.1 4z"/></svg>TikTok';
        links[1].href = 'https://github.com/dhisjwhd-svg';
        links[1].innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .9a11.1 11.1 0 0 0-3.5 21.6c.6.1.8-.3.8-.6v-2.1c-3.1.7-3.8-1.3-3.8-1.3-.5-1.3-1.2-1.6-1.2-1.6-1-.7.1-.7.1-.7 1.1.1 1.7 1.1 1.7 1.1 1 1.7 2.6 1.2 3.2.9.1-.7.4-1.2.7-1.5-2.5-.3-5.1-1.3-5.1-5.5 0-1.2.4-2.2 1.1-3-.1-.3-.5-1.4.1-2.9 0 0 .9-.3 3.1 1.1a10.8 10.8 0 0 1 5.7 0C17.1 4.2 18 4.5 18 4.5c.6 1.5.2 2.6.1 2.9.7.8 1.1 1.8 1.1 3 0 4.2-2.6 5.2-5.1 5.5.4.3.8 1 .8 2v3.4c0 .3.2.7.8.6A11.1 11.1 0 0 0 12 .9Z"/></svg>GitHub';
      }
    }
    prev.hidden = index === 0;
    next.hidden = index === members.length - 1;
  }
  function goTo(index) {
    if (transitioning || index < 0 || index >= members.length || index === active) return;
    transitioning = true;
    card.classList.add('member-leaving');
    window.setTimeout(() => {
      active = index;
      renderMember(active);
      card.classList.remove('member-leaving');
      card.classList.add('member-entering');
      requestAnimationFrame(() => requestAnimationFrame(() => {
        card.classList.remove('member-entering');
        window.setTimeout(() => { transitioning = false; }, 260);
      }));
    }, 240);
  }
  prev.addEventListener('click', () => goTo(active - 1));
  next.addEventListener('click', () => goTo(active + 1));
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' && active > 0) goTo(active - 1);
    if (e.key === 'ArrowRight' && active < members.length - 1) goTo(active + 1);
  });
  renderMember(active);
})();
</script>

</body></html>
