<style>
:root{color-scheme:dark;--bg:#232428;--panel:#2b2d31;--panel2:#313338;--muted:#b5bac1;--line:#3f4147;--pink:#b9a3ff;--white:#f2f3f5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px 16px;background:linear-gradient(135deg,#202127,var(--bg) 52%,#25202e);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--white)}
.profile{width:min(100%,760px);overflow:hidden;border:1px solid #3b3d44;border-radius:12px;background:var(--panel);box-shadow:0 24px 80px #0008}
.banner{height:190px;position:relative;overflow:hidden;background:linear-gradient(120deg,#252b49,#61416b 48%,#202033)}
.banner:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#2b2d31 0%,transparent 68%)}
.banner svg{width:100%;height:100%;display:block}
.content{position:relative;padding:0 25px 25px}.avatar-wrap{width:108px;height:108px;margin-top:-57px;position:relative;z-index:1;border:7px solid var(--panel);border-radius:28%;background:#312233;overflow:hidden}.avatar{width:100%;height:100%;display:block;object-fit:cover}
.status{position:absolute;right:0;bottom:0;width:23px;height:23px;border:4px solid var(--panel);border-radius:50%;background:#5cba87}
.identity{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:13px}.name{font-size:25px;letter-spacing:-.7px;font-weight:760}.verified{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:6px;background:#5865f2;color:white;font-size:12px;font-weight:900}.handle{color:var(--muted);margin-top:1px}
.rule{height:1px;background:var(--line);margin:21px 0}.section-label{font-size:11px;font-weight:800;letter-spacing:1.6px;color:#b9a3ff;text-transform:uppercase;margin-bottom:10px}
.bio{font-size:15px;color:#e9e3ed;max-width:480px}.bio em{color:#f0b9d5;font-style:normal}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.pill{border:1px solid #454750;background:#313338;border-radius:7px;padding:6px 10px;color:#d9d0df;font-size:12px}
.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.link{display:flex;align-items:center;justify-content:center;gap:8px;min-height:45px;text-decoration:none;color:#f4edf7;border:1px solid #454750;background:#313338;border-radius:8px;font-size:13px;font-weight:650;transition:transform .18s,border-color .18s,background .18s}.link:hover{transform:translateY(-2px);border-color:#8e7bdb;background:#383344}.link svg{width:17px;height:17px;flex:none}
.footer{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:22px;color:#8f8799;font-size:11px;letter-spacing:.7px;text-transform:uppercase}.footer span:last-child{color:#b9a3ff}
@media(max-width:440px){.banner{height:145px}.content{padding:0 18px 20px}.name{font-size:22px}.links{grid-template-columns:1fr}.link{justify-content:flex-start;padding:0 15px}.footer{font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style>
